name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    # Dummy values so startup env validation (instrumentation.ts) and the
    # production build succeed. Tests that need specific env set it themselves.
    env:
      MONGODB_URI: mongodb://localhost:27017/juntas-ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-0000000000000000000
      NEXT_PUBLIC_APP_URL: https://ci.example.com
      EMAIL_USER: ci@example.com
      EMAIL_PASSWORD: ci-password
      EMAIL_FROM: ci@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Production build
        run: npm run build
